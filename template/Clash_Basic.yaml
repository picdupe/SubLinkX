port: 7890
socks-port: 7891
allow-lan: true
mode: rule
log-level: info
external-controller: 127.0.0.1:9090

proxies: []

proxy-groups:
  # 全局组
  - name: GLOBAL
    type: select
    proxies:
      - Proxies

  # 代理组
  - name: Proxies
    type: select
    proxies: []

rules:
  # 局域网直连
  - GEOIP,private,DIRECT,no-resolve

  # ========== 海外域名走代理==========

  # --- AI 服务 ---
  - DOMAIN-SUFFIX,openai.com,Proxies
  - DOMAIN-SUFFIX,chatgpt.com,Proxies
  - DOMAIN-SUFFIX,oaistatic.com,Proxies
  - DOMAIN-SUFFIX,oaiusercontent.com,Proxies
  - DOMAIN-SUFFIX,anthropic.com,Proxies
  - DOMAIN-SUFFIX,claude.ai,Proxies

  # --- Google 全家桶 ---
  - DOMAIN-SUFFIX,google.com,Proxies
  - DOMAIN-SUFFIX,googleapis.com,Proxies
  - DOMAIN-SUFFIX,gmail.com,Proxies
  - DOMAIN-SUFFIX,youtube.com,Proxies
  - DOMAIN-SUFFIX,googlevideo.com,Proxies
  - DOMAIN-SUFFIX,googleusercontent.com,Proxies

  # --- Meta / 社交 ---
  - DOMAIN-SUFFIX,facebook.com,Proxies
  - DOMAIN-SUFFIX,instagram.com,Proxies
  - DOMAIN-SUFFIX,whatsapp.com,Proxies
  - DOMAIN-SUFFIX,x.com,Proxies
  - DOMAIN-SUFFIX,twitter.com,Proxies
  - DOMAIN-SUFFIX,reddit.com,Proxies

  # --- 开发 / 代码托管 ---
  - DOMAIN-SUFFIX,github.com,Proxies
  - DOMAIN-SUFFIX,githubusercontent.com,Proxies
  - DOMAIN-SUFFIX,github.io,Proxies

  # --- 流媒体 / 音乐 ---
  - DOMAIN-SUFFIX,netflix.com,Proxies
  - DOMAIN-SUFFIX,spotify.com,Proxies
  - DOMAIN-SUFFIX,telegram.org,Proxies

  # ========== 国内直连 ==========

  # 中国大陆域名直连
  - GEOSITE,cn,DIRECT

  # 中国大陆 IP 直连，允许 DNS 解析
  - GEOIP,CN,DIRECT

  # 其他流量使用代理
  - MATCH,Proxies
